- label: Foundations
  description: Mathematical tools and optimization methods that support learning and control.
  topics:
    - key: optimization
      label: Optimization
      description: Convex analysis, numerical methods, and differentiable optimization.
    - key: mathematics
      label: Mathematical Foundations
      description: Linear algebra, probability, and the mathematics behind learning.

- label: Decision & Control
  description: Methods for planning, control, and learning from rewards or human guidance.
  topics:
    - key: control
      label: Control & Planning
      description: Optimal control, model predictive control, and safe planning.
    - key: reinforcement learning
      label: Reinforcement Learning
      description: Sequential decisions, policy learning, and reward-driven control.
    - key: imitation and intervention learning
      label: Imitation & Intervention Learning
      description: Learning from demonstrations, human corrections, and feedback.

- label: Learning Systems
  description: Generative modeling and robust learning across tasks, domains, and data regimes.
  topics:
    - key: generative models
      label: Generative Models
      description: Diffusion, flow matching, and generative policies.
    - key: generalization
      label: Generalization
      description: Domain adaptation, transfer, and meta-learning across tasks.
    - key: representation learning
      label: Representation Learning
      description: Contrastive objectives, feature geometry, and learned representations.
