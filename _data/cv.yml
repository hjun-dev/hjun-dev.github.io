- title: Projects
  type: time_table
  contents:
    - title: AI-based Moving Target Tracking & Situational Awareness using Sensor Networks (Funded by Hanwha Aerospace)
      year: 2024 - 2025
      description: >
        Developing a 6-DOF simulation-based smart munition detection system in Unity. 
        Implementing a real-time target detection pipeline using Laser Range Finder (LRF) data 
        and a TCN-DAE based anomaly detection model for robust target recognition.
    - title: Deep learning model for off-road vehicle state estimation (Funded by Hyundai Motor Company)
      year: 2025 - 2026
      description: >
        Developing a deep learning-based vehicle state estimation algorithm for off-road vehicles.
    - title: Data-efficient Safe Reinforcement Learning from Human Corrections (Funded by Airbus Institute for Engineering Research)
      year: 2025 - 2027
      description: >
        Research on reinforcement learning enhanced with computational models of human interventions.
        Integrating human correction signals to improve safety, stability, and data efficiency for aerospace systems.

