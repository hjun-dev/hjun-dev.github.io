- title: Projects
  type: time_table
  contents:
    - title: Local LLM-based AI agents for autonomous eVTOL operations
      institution: Funded by Korea Aerospace Research Institute
      year: 2026 - 2030
      description:
        - Local LLM-based Agent-Skill architecture with closed-network RAG for autonomous decision-making across eVTOL traffic management, flight operations, vertiport operations, and air traffic control
        - Intervention learning within the human-in-the-loop coordination and digital integrated-test validation for conflict resolution, mission replanning, resource allocation, and emergency response
      linkitems:
        - linkname: Korea Aerospace Research Institute
          link: https://www.kari.re.kr/
    - title: Cross-vehicle domain adaptation and generalization for AI-based road surface classification
      institution: Funded by Hyundai Motor Company
      year: 2026 - 2027
      description:
        - Domain-invariant feature learning from wheel-speed and IMU signals using adversarial domain alignment, supervised contrastive learning, and weight averaging for robust classification across unseen vehicle domains
        - Few-shot adaptation and vehicle-metadata-based feature modulation for rapid transfer to new vehicle types, with knowledge distillation and in-vehicle validation for embedded deployment
      linkitems:
        - linkname: Hyundai Motor Company
          link: https://www.hyundai.com/
    - title: Data-efficient safe reinforcement learning from human corrections
      institution: Funded by Airbus Institute for Engineering Research and USC
      year: 2025 - 2027
      description:
        - Reinforcement learning enhanced with computational modeling of human interventions
        - Integration of human correction models to improve the safety and data-efficiency of aerospace systems
      linkitems:
        - linkname: Airbus Institute for Engineering Research
          link: https://viterbischool.usc.edu/aier/
        - linkname: USC
          link: https://www.usc.edu/
    - title: Deep learning model for off-road vehicle state estimation
      institution: Funded by Hyundai Motor Company
      year: 2025 - 2026
      description: >
        Developing a deep learning-based vehicle state estimation algorithm for off-road vehicles.
      linkitems:
        - linkname: Hyundai Motor Company
          link: https://www.hyundai.com/
    - title: AI-based Moving Target Tracking & Situational Awareness using Sensor Networks
      institution: Funded by Hanwha Aerospace
      year: 2024 - 2025
      description: >
        Developing a 6-DOF simulation-based smart munition detection system in Unity. 
        Implementing a real-time target detection pipeline using Laser Range Finder (LRF) data 
        and a TCN-DAE based anomaly detection model for robust target recognition.
      linkitems:
        - linkname: Hanwha Aerospace
          link: https://www.hanwhaaerospace.com/eng/index.do
